<!DOCTYPE html>
<html lang="tr" style="background-color: #071324;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#071324" />
  <title>Renkli Çark - İğne Saplama Oyunu</title>

  <!-- Web Sitesi İkonu (Favicon) ve Mobil Ana Ekran İkonu (Apple Touch Icon) -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/logo.png?v=20261023_v4" />
  <link rel="shortcut icon" type="image/png" href="assets/images/logo.png?v=20261023_v4" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png?v=20261023_v4" />

  <!-- Google Analytics (GA4) Global Site Etiketi (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9NV6P1MDQQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    try {
      gtag('js', new Date());
      window.GA_MEASUREMENT_ID = 'G-9NV6P1MDQQ';
      gtag('config', 'G-9NV6P1MDQQ', {
        page_title: 'Renkli Çark - Needle Twist Game',
        page_location: window.location.href,
        send_page_view: true
      });
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="style.css?v=20261023_v4" />
</head>
<body style="background-color: #071324; color: #ffffff;">
  <div id="game-container">
    <!-- Top HUD -->
    <header class="hud">
      <div class="hud-card">
        <span class="hud-label">Skor</span>
        <span class="hud-value score" id="hudScore">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Seviye</span>
        <span class="hud-value level" id="hudLevel">1</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Can</span>
        <span class="hud-value lives" id="hudLives">❤️ 1</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Rekor</span>
        <span class="hud-value best" id="hudBest">0</span>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="btnScoreboard" title="Küresel Skor Tablosu" aria-label="Küresel Skor Tablosu">🏆</button>
        <button class="icon-btn" id="btnSound" title="Sesi Aç/Kapat" aria-label="Sesi Aç/Kapat">🔊</button>
      </div>
    </header>

    <!-- Dynamic Difficulty Mode Indicator -->
    <div class="difficulty-banner" id="difficultyBanner">Seviye 1 • Tam Tur Rahat Dönüş</div>

    <!-- Per-Pin Time Limit Bar -->
    <div class="timer-bar-wrap" id="timerBarWrap">
      <div class="timer-bar-header">
        <span class="timer-label" id="timerLabel">⏱️ İğne Süresi</span>
        <span class="timer-value" id="timerValue">12.2s • ⚡+11 P</span>
      </div>
      <div class="timer-track">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Start / Pause / Scoreboard / Game Over Overlay -->
    <div class="overlay" id="mainOverlay">
      <div class="modal-card">
        <div class="modal-logo-wrap" id="modalLogoWrap">
          <img
            src="assets/images/logo.png?v=20261023_v4"
            alt="Renkli Çark Logo"
            class="modal-logo"
            onerror="this.style.display='none'; if(this.parentElement) this.parentElement.style.display='none';"
          />
        </div>
        <h1 class="game-title" id="modalTitle">RENKLİ ÇARK</h1>
        <p class="modal-subtitle" id="modalSubtitle">
          İğneleri kendi rengindeki çark dilimine veya aynı renkli iğnenin yanına saplayarak <strong>2x Renk Uyumu Bonusu</strong> kazan!
        </p>

        <div class="stats-grid" id="endStats" style="display: none;">
          <div class="stat-box">
            <div class="label">Son Skor</div>
            <div class="val" id="finalScore" style="color: #00f5d4;">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Ulaşılan Seviye</div>
            <div class="val" id="finalLevel" style="color: #ffcc00;">1</div>
          </div>
        </div>

        <!-- Save Score Form (shown on Game Over) -->
        <form class="save-score-form" id="saveScoreForm" style="display: none;">
          <input
            type="text"
            id="playerNameInput"
            maxlength="16"
            placeholder="Takma adını gir (Nickname)..."
            autocomplete="nickname"
            required
          />
          <button type="submit" class="btn btn-small" id="btnSubmitScore">Skoru Kaydet 🚀</button>
        </form>
        <div class="save-feedback" id="saveFeedback" style="display: none;"></div>

        <!-- Global Leaderboard (Turquoise / Modern Theme) -->
        <div class="scoreboard-section">
          <div class="scoreboard-header">
            <div class="scoreboard-title-group">
              <span class="scoreboard-title">🏆 Küresel İlk 10 Skor Tablosu</span>
              <span class="sync-badge" id="syncBadge">● Canlı</span>
            </div>
            <div class="scoreboard-actions">
              <button type="button" class="refresh-btn" id="btnRefreshScores" title="Skorları Yenile">↻ Yenile</button>
            </div>
          </div>
          <div class="scoreboard-list" id="scoreboardList"></div>
        </div>

        <button type="button" class="btn btn-primary" id="btnStartGame">▶ OYUNA BAŞLA</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=20261023_v4"></script>
</body>
</html>
