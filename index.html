<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a1628" />
  <title>Renkli Çark - İğne Saplama Oyunu</title>

  <!-- Google Analytics (GA4) Ziyaretçi ve Etkinlik Takip Altyapısı -->
  <!-- Not: Kendi GA4 Measurement ID'nizi (örn. G-XXXXXXXXXX) GA_MEASUREMENT_ID değişkenine yazabilirsiniz -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NEEDLETWIST"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    window.GA_MEASUREMENT_ID = 'G-NEEDLETWIST';
    gtag('config', window.GA_MEASUREMENT_ID, {
      page_title: 'Renkli Çark - Needle Twist Game',
      page_location: window.location.href,
      send_page_view: true
    });
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <!-- Top HUD -->
    <header class="hud">
      <div class="hud-card">
        <span class="hud-label">Skor</span>
        <span class="hud-value score" id="hudScore">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Seviye</span>
        <span class="hud-value level" id="hudLevel">1</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Rekor</span>
        <span class="hud-value best" id="hudBest">0</span>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="btnScoreboard" title="Küresel Skor Tablosu" aria-label="Küresel Skor Tablosu">🏆</button>
        <button class="icon-btn" id="btnSound" title="Sesi Aç/Kapat" aria-label="Sesi Aç/Kapat">🔊</button>
      </div>
    </header>

    <!-- Dynamic Difficulty Mode Indicator -->
    <div class="difficulty-banner" id="difficultyBanner">Seviye 1 • Tam Tur Rahat Dönüş</div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Start / Pause / Scoreboard / Game Over Overlay -->
    <div class="overlay" id="mainOverlay">
      <div class="modal-card">
        <h1 class="game-title" id="modalTitle">RENKLİ ÇARK</h1>
        <p class="modal-subtitle" id="modalSubtitle">
          İğneleri kendi rengindeki çark dilimine veya aynı renkli iğnenin yanına saplayarak <strong>2x Renk Uyumu Bonusu</strong> kazan!
        </p>

        <div class="stats-grid" id="endStats" style="display: none;">
          <div class="stat-box">
            <div class="label">Son Skor</div>
            <div class="val" id="finalScore" style="color: #00f5d4;">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Ulaşılan Seviye</div>
            <div class="val" id="finalLevel" style="color: #ffcc00;">1</div>
          </div>
        </div>

        <!-- Save Score Form (shown on Game Over) -->
        <form class="save-score-form" id="saveScoreForm" style="display: none;">
          <input
            type="text"
            id="playerNameInput"
            maxlength="16"
            placeholder="Takma adını gir (Nickname)..."
            autocomplete="nickname"
            required
          />
          <button type="submit" class="btn btn-small" id="btnSubmitScore">Skoru Kaydet 🚀</button>
        </form>
        <div class="save-feedback" id="saveFeedback" style="display: none;"></div>

        <!-- Global Leaderboard (Turquoise / Modern Theme) -->
        <div class="scoreboard-section">
          <div class="scoreboard-header">
            <div class="scoreboard-title-group">
              <span class="scoreboard-title">🏆 Küresel İlk 10 Skor Tablosu</span>
              <span class="sync-badge" id="syncBadge">● Canlı</span>
            </div>
            <div class="scoreboard-actions">
              <button type="button" class="refresh-btn" id="btnRefreshScores" title="Skorları Yenile">↻ Yenile</button>
              <button type="button" class="clear-btn" id="btnClearScores" title="Yerel önbelleği sıfırla">Sıfırla</button>
            </div>
          </div>
          <div class="scoreboard-list" id="scoreboardList"></div>
        </div>

        <button type="button" class="btn btn-primary" id="btnStartGame">▶ OYUNA BAŞLA</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
