<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Renkli Çark - İğne Saplama Oyunu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <!-- Top HUD -->
    <header class="hud">
      <div class="hud-card">
        <span class="hud-label">Skor</span>
        <span class="hud-value score" id="hudScore">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Seviye</span>
        <span class="hud-value level" id="hudLevel">1</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Rekor</span>
        <span class="hud-value best" id="hudBest">0</span>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="btnScoreboard" title="Skor Tablosu" aria-label="Skor Tablosu">🏆</button>
        <button class="icon-btn" id="btnSound" title="Sesi Aç/Kapat" aria-label="Sesi Aç/Kapat">🔊</button>
      </div>
    </header>

    <!-- Dynamic Difficulty Mode Indicator -->
    <div class="difficulty-banner" id="difficultyBanner">Seviye 1 • Sabit Dönüş</div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <div class="touch-hint" id="touchHint">İğne fırlatmak için ekrana dokun veya [Boşluk] tuşuna bas</div>

    <!-- Start / Pause / Scoreboard / Game Over Overlay -->
    <div class="overlay" id="mainOverlay">
      <div class="modal-card">
        <h1 class="game-title" id="modalTitle">RENKLİ ÇARK</h1>
        <p class="modal-subtitle" id="modalSubtitle">
          Dönen renkli çarka diğer iğnelere çarpmadan tüm iğneleri sapla! Yıldızları vurarak ekstra puan kazan.
        </p>

        <div class="stats-grid" id="endStats" style="display: none;">
          <div class="stat-box">
            <div class="label">Son Skor</div>
            <div class="val" id="finalScore" style="color: #00e5ff;">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Ulaşılan Seviye</div>
            <div class="val" id="finalLevel" style="color: #ffcc00;">1</div>
          </div>
        </div>

        <!-- Save Score Form (shown on Game Over) -->
        <form class="save-score-form" id="saveScoreForm" style="display: none;">
          <input type="text" id="playerNameInput" maxlength="16" placeholder="Adını yaz (Örn: Oyuncu1)" autocomplete="off" />
          <button type="submit" class="btn btn-small">Kaydet</button>
        </form>

        <!-- Leaderboard -->
        <div class="scoreboard-section">
          <div class="scoreboard-header">
            <span class="scoreboard-title">🏆 En Yüksek Skorlar</span>
            <button type="button" class="clear-btn" id="btnClearScores">Sıfırla</button>
          </div>
          <div class="scoreboard-list" id="scoreboardList"></div>
        </div>

        <button type="button" class="btn btn-primary" id="btnStartGame">▶ OYUNA BAŞLA</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
